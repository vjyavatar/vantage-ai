services:
  - type: web
    name: vantage-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python commercial_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
